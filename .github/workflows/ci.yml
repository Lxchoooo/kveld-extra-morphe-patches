name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  verify:
    name: Verify
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Gradle check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew check --no-daemon
